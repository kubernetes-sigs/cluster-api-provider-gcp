---
# E2E test scenario using local dev images and manifests built from the source tree for following providers:
# - cluster-api
# - bootstrap kubeadm
# - control-plane kubeadm
# - gcp
managementClusterName: capg-e2e

images:
  # Use local dev images built source tree;
  - name: gcr.io/k8s-staging-cluster-api-gcp/cluster-api-gcp-controller:e2e
    loadBehavior: mustLoad

providers:
  - name: cluster-api
    type: CoreProvider
    versions:
      - name: v1.14.2
        value: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/core-components.yaml
        type: url
        files:
          - sourcePath: "../data/shared/v1beta1/metadata.yaml"
        replacements:
          - old: "imagePullPolicy: Always"
            new: "imagePullPolicy: IfNotPresent"
          - old: "--leader-elect"
            new: "--leader-elect=false"
  - name: kubeadm
    type: BootstrapProvider
    versions:
      - name: v1.14.2
        value: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/bootstrap-components.yaml
        type: url
        files:
          - sourcePath: "../data/shared/v1beta1/metadata.yaml"
        replacements:
          - old: "imagePullPolicy: Always"
            new: "imagePullPolicy: IfNotPresent"
          - old: "--leader-elect"
            new: "--leader-elect=false"
  - name: kubeadm
    type: ControlPlaneProvider
    versions:
      - name: v1.14.2
        value: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.2/control-plane-components.yaml
        type: url
        files:
          - sourcePath: "../data/shared/v1beta1/metadata.yaml"
        replacements:
          - old: "imagePullPolicy: Always"
            new: "imagePullPolicy: IfNotPresent"
          - old: "--leader-elect"
            new: "--leader-elect=false"
  - name: gcp
    type: InfrastructureProvider
    versions:
      - name: v1.14.99 # next; use manifest from source files
        value: "${PWD}/config/default"
    files:
      - sourcePath: "${PWD}/metadata.yaml"
        targetName: "metadata.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci.yaml"
        targetName: "cluster-template.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-prow-ci-version.yaml"
        targetName: "cluster-template-conformance-ci-artifacts.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-upgrades.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-kcp-remediation.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/withclusterclass/cluster-template-ci-topology.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/withclusterclass/cluster-template-ci-topology.yaml"
        targetName: "cluster-template-topology.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/clusterclass-quick-start.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-with-creds.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-gke.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-gke-autopilot.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-gke-custom-subnet.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-with-external-and-internal-lb.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-with-internal-lb.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/clusterclass-gke-autopilot-cc.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/withclusterclass/cluster-template-ci-gke-autopilot-topology.yaml"
      - sourcePath: "${PWD}/test/e2e/data/infrastructure-gcp/cluster-template-ci-with-firewall-rules.yaml"

variables:
  # Hand-Edited Version Inputs

  # Everything Kubernetes related derives from it at CI time via hack/resolve-e2e-versions.sh.
  KUBERNETES_MINOR: "1.36"
  CAPG_UBUNTU_VERSION: "2204"

  # Derived and other variables (maintain alphabetical order)

  CAPG_LOGLEVEL: "4"
  CCM: "${PWD}/test/e2e/data/ccm/gce-cloud-controller-manager.yaml"
  CCM_VERSION: "${CCM_VERSION}"
  CLUSTER_AUTOSCALER_VERSION: "${CLUSTER_AUTOSCALER_VERSION}"
  CLUSTER_TOPOLOGY: "true"
  CNI: "${PWD}/test/e2e/data/cni/calico/calico.yaml"
  CONFORMANCE_CONTROL_PLANE_MACHINE_COUNT: "${CONFORMANCE_CONTROL_PLANE_MACHINE_COUNT:-1}"
  CONFORMANCE_NODES: "${CONFORMANCE_NODES:-4}"
  CONFORMANCE_WORKER_MACHINE_COUNT: "2"
  CONTROL_PLANE_MACHINE_TEMPLATE_UPGRADE_TO: "cp-k8s-upgrade-and-conformance"
  COREDNS_VERSION_UPGRADE_TO: "${COREDNS_VERSION_UPGRADE_TO}"
  ETCD_VERSION_UPGRADE_TO: "${ETCD_VERSION_UPGRADE_TO}"
  EXP_CAPG_GKE: "true"
  EXP_CLUSTER_RESOURCE_SET: "true"
  EXP_MACHINE_POOL: "true"
  GCP_CONTROL_PLANE_MACHINE_TYPE: n1-standard-2
  GCP_NODE_MACHINE_TYPE: n1-standard-2
  GCP_SSH_KEY: "${GCP_SSH_KEY:-}"
  IMAGE_ID: "${IMAGE_ID}"
  IP_FAMILY: "IPv4"
  KUBERNETES_IMAGE_UPGRADE_FROM: "${KUBERNETES_IMAGE_UPGRADE_FROM}"
  KUBERNETES_IMAGE_UPGRADE_TO: "${KUBERNETES_IMAGE_UPGRADE_TO}"
  KUBERNETES_VERSION: "${KUBERNETES_VERSION}"
  KUBERNETES_VERSION_GKE: "${KUBERNETES_VERSION_GKE}"
  KUBERNETES_VERSION_MANAGEMENT: "${KUBERNETES_VERSION_MANAGEMENT}"
  KUBERNETES_VERSION_UPGRADE_FROM: "${KUBERNETES_VERSION_UPGRADE_FROM}"
  KUBERNETES_VERSION_UPGRADE_TO: "${KUBERNETES_VERSION_UPGRADE_TO}"
  KUBETEST_CONFIGURATION: "${PWD}/test/e2e/data/kubetest/conformance.yaml"
  WORKERS_MACHINE_TEMPLATE_UPGRADE_TO: "worker-k8s-upgrade-and-conformance"

intervals:
  default/wait-controllers: ["5m", "10s"]
  # Neither 20m nor 25m was enough for GKE Autopilot's slower provisioning -
  # it was still legitimately in progress (GKEControlPlaneCreating: True),
  # not stuck, both times. Matching the other GKE-related intervals below
  # (wait-private-cluster, wait-control-plane, wait-gpu-nodes) that already
  # use 30m. All GKE creation specs share this key (same specName), so
  # bumping it doesn't slow down the faster (non-autopilot) ones - Eventually
  # returns as soon as it succeeds either way.
  default/wait-cluster: ["30m", "10s"]
  default/wait-private-cluster: ["30m", "10s"]
  default/wait-control-plane: ["30m", "10s"]
  default/wait-control-plane-ha: ["30m", "10s"]
  default/wait-worker-nodes: ["25m", "10s"]
  default/wait-gpu-nodes: ["30m", "10s"]
  default/wait-delete-cluster: ["15m", "10s"]
  default/wait-control-plane-upgrade: ["15m", "10s"]
  default/wait-machine-deployment-upgrade: ["10m", "10s"]
  default/wait-machine-upgrade: ["60m", "10s"]
  default/wait-machine-pool-upgrade: ["60m", "10s"]
  default/wait-machine-remediation: ["30m", "10s"]
  default/wait-deployment: ["15m", "10s"]
  default/wait-daemonset: ["15m", "10s"]
  default/wait-deployment-available: ["15m", "10s"]
  default/wait-job: ["5m", "10s"]
  default/wait-service: ["15m", "10s"]
  default/wait-machine-pool-nodes: ["30m", "10s"]
  default/wait-nsg-update: ["20m", "10s"]
  # GKE deletion tears down node pools, then the control plane, then the
  # cluster. 30m matches the other GKE intervals above.
  delete-gke-workload-cluster/wait-delete-cluster: ["30m", "10s"]
  gke/wait-delete-cluster: ["30m", "10s"]
  node-drain/wait-machine-deleted: ["10m", "10s"]
