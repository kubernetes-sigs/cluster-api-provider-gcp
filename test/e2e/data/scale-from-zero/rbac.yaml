---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler-management-{{.ClusterName}}
rules:
  # CAPI management cluster resources
  - apiGroups: ["cluster.x-k8s.io"]
    resources:
      - "machinedeployments"
      - "machinedeployments/scale"
      - "machines"
      - "machinesets"
      - "machinesets/scale"
      - "machinepools"
      - "machinepools/scale"
    verbs: ["get", "list", "watch", "patch", "update"]
  # CAPG infrastructure resources - read-only for autoscaling-from-zero
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources:
      - "gcpmachines"
      - "gcpmachinetemplates"
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler-management-{{.ClusterName}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler-management-{{.ClusterName}}
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: {{.Namespace}}
