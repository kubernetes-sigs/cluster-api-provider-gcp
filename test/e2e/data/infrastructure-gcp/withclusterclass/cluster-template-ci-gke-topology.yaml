apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  topology:
    class: gke-cc
    version: ${KUBERNETES_VERSION}
    workers:
      machinePools:
      - class: default-worker
        name: mp-0
        replicas: ${WORKER_MACHINE_COUNT}
    variables:
    - name: region
      value: ${GCP_REGION}
    - name: networkName
      value: ${GCP_NETWORK_NAME}
