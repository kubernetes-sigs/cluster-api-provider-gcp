---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gcpmanagedcontrolplanes.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: GCPManagedControlPlane
    listKind: GCPManagedControlPlaneList
    plural: gcpmanagedcontrolplanes
    shortNames:
    - gcpmcp
    singular: gcpmanagedcontrolplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this GCPManagedControlPlane belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Control plane is ready
      jsonPath: .status.ready
      name: Ready
      type: boolean
    - description: The current Kubernetes version
      jsonPath: .status.currentVersion
      name: CurrentVersion
      type: string
    - description: The Kubernetes version of the GKE control plane
      jsonPath: .status.version
      name: Version
      type: string
    - description: API Endpoint
      jsonPath: .spec.endpoint
      name: Endpoint
      priority: 1
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: GCPManagedControlPlane is the Schema for the gcpmanagedcontrolplanes
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GCPManagedControlPlaneSpec defines the desired state of GCPManagedControlPlane.
            properties:
              binaryAuthorization:
                description: |-
                  BinaryAuthorization represents the mode of operation of Binary Authorization for the GKE cluster.
                  This feature is disabled if this field is not specified.
                enum:
                - disabled
                - project_singleton_policy_enforce
                type: string
              clusterName:
                description: |-
                  ClusterName allows you to specify the name of the GKE cluster.
                  If you don't specify a name then a default name will be created
                  based on the namespace and name of the managed control plane.
                type: string
              clusterNetwork:
                description: ClusterNetwork define the cluster network.
                properties:
                  datapathProvider:
                    description: |-
                      DatapathProvider represents the desired datapath provider for the GKE cluster.
                      If unspecified, GKE uses the default IPTables-based kube-proxy implementation.
                      This field is immutable once the cluster has been created, and is always
                      "advanced" (Dataplane V2) for Autopilot clusters.
                    enum:
                    - legacy
                    - advanced
                    type: string
                  dnsConfig:
                    description: |-
                      DNSConfig represents the cluster DNS configuration for the GKE cluster.
                      Once set, it cannot be removed entirely, though its contents may be changed.
                    properties:
                      clusterDNS:
                        description: |-
                          ClusterDNS represents which in-cluster DNS provider should be used.
                          If not specified, defaults to the GKE default DNS provider (kube-dns).
                        enum:
                        - platform
                        - cloud-dns
                        - kube-dns
                        type: string
                      clusterDNSDomain:
                        description: ClusterDNSDomain is the suffix used for all GKE
                          cluster service records.
                        type: string
                      clusterDNSScope:
                        description: |-
                          ClusterDNSScope represents the scope of access to the GKE cluster DNS records.
                          If not specified, defaults to cluster scope.
                        enum:
                        - cluster
                        - vpc
                        type: string
                    type: object
                  gatewayAPIChannel:
                    description: |-
                      GatewayAPIChannel controls whether the GKE-managed Gateway API controller
                      is enabled on the cluster, and which release channel it runs on.
                    enum:
                    - disabled
                    - standard
                    type: string
                  pod:
                    description: Pod defines the range of CIDRBlock list from where
                      it gets the IP address.
                    properties:
                      cidrBlock:
                        description: |-
                          CidrBlock is where all pods in the cluster are assigned an IP address from this range. Enter a range
                          (in CIDR notation) within a network range, a mask, or leave this field blank to use a default range.
                          This setting is permanent.
                        type: string
                      secondaryRangeName:
                        description: |-
                          SecondaryRangeName is the name of the existing secondary range in the cluster's subnetwork to
                          use for pod IP addresses. The range must already exist on the subnet. Only applicable if
                          UseIPAliases is true. Mutually exclusive with CidrBlock. This setting is permanent.
                        type: string
                    type: object
                  privateCluster:
                    description: PrivateCluster defines the private cluster spec.
                    properties:
                      controlPlaneCidrBlock:
                        description: |-
                          ControlPlaneCidrBlock is the IP range in CIDR notation to use for the hosted master network. This range must not
                          overlap with any other ranges in use within the cluster's network. Honored when enabled is true.
                        type: string
                      controlPlaneGlobalAccess:
                        description: ControlPlaneGlobalAccess is whenever master is
                          accessible globally or not. Honored when enabled is true.
                        type: boolean
                      disableDefaultSNAT:
                        description: DisableDefaultSNAT disables cluster default sNAT
                          rules. Honored when enabled is true.
                        type: boolean
                      enablePrivateEndpoint:
                        description: |-
                          EnablePrivateEndpoint: Whether the master's internal IP
                          address is used as the cluster endpoint.
                        type: boolean
                      enablePrivateNodes:
                        description: |-
                          EnablePrivateNodes: Whether nodes have internal IP
                          addresses only. If enabled, all nodes are given only RFC
                          1918 private addresses and communicate with the master via
                          private networking.
                        type: boolean
                    type: object
                  service:
                    description: Service defines the range of CIDRBlock list from
                      where it gets the IP address.
                    properties:
                      cidrBlock:
                        description: |-
                          CidrBlock is where cluster services will be assigned an IP address from this IP address range. Enter a range
                          (in CIDR notation) within a network range, a mask, or leave this field blank to use a default range.
                          This setting is permanent.
                        type: string
                      secondaryRangeName:
                        description: |-
                          SecondaryRangeName is the name of the existing secondary range in the cluster's subnetwork to
                          use for service cluster IPs. The range must already exist on the subnet. Only applicable if
                          UseIPAliases is true. Mutually exclusive with CidrBlock. This setting is permanent.
                        type: string
                    type: object
                  useIPAliases:
                    description: |-
                      UseIPAliases is whether alias IPs will be used for pod IPs in the cluster. If false, routes will be used for
                      pod IPs in the cluster.
                    type: boolean
                type: object
              clusterSecurity:
                description: ClusterSecurity defines the cluster security.
                properties:
                  authenticatorGroupConfig:
                    description: AuthenticatorGroupConfig is RBAC security group for
                      use with Google security groups in Kubernetes RBAC.
                    properties:
                      securityGroups:
                        description: SecurityGroups is the name of the security group-of-groups
                          to be used.
                        type: string
                    required:
                    - securityGroups
                    type: object
                  workloadIdentityConfig:
                    description: |-
                      WorkloadIdentityConfig allows workloads in your GKE clusters to impersonate Identity and Access Management (IAM)
                      service accounts to access Google Cloud services
                    properties:
                      workloadPool:
                        description: |-
                          WorkloadPool is the workload pool to attach all Kubernetes service accounts to Google Cloud services.
                          Only relevant when enabled is true
                        type: string
                    required:
                    - workloadPool
                    type: object
                type: object
              controlPlaneVersion:
                description: |-
                  ControlPlaneVersion represents the control plane version of the GKE cluster.
                  If not specified, the default version currently supported by GKE will be
                  used.

                  Deprecated: This field will soon be removed and you are expected to use Version instead.
                type: string
              description:
                description: Description describe the cluster.
                type: string
              enableAutopilot:
                description: EnableAutopilot indicates whether to enable autopilot
                  for this GKE cluster.
                type: boolean
              enableIdentityService:
                description: EnableIdentityService indicates whether to enable Identity
                  Service component for this GKE cluster.
                type: boolean
              endpoint:
                description: Endpoint represents the endpoint used to communicate
                  with the control plane.
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    type: integer
                type: object
              location:
                description: |-
                  Location represents the location (region or zone) in which the GKE cluster
                  will be created.
                type: string
              loggingService:
                description: |-
                  LoggingService represents configuration of logging service feature of the GKE cluster.
                  Possible values: none, logging.googleapis.com/kubernetes (default).
                  Value is ignored when enableAutopilot = true.
                type: string
              machineTemplate:
                description: |-
                  MachineTemplate contains information about how machines
                  should be shaped when creating or updating a control plane.
                  For the GCPManagedControlPlaneTemplate, this field is used
                  only to fulfill the CAPI contract.
                type: object
              maintenancePolicy:
                description: MaintenancePolicy represents configuration options for
                  the GKE cluster maintenance policy.
                properties:
                  dailyMaintenanceWindow:
                    description: |-
                      DailyMaintenanceWindow represents a daily maintenance time window for use with the GKE cluster.
                      Only one of DailyMaintenanceWindow and RecurringMaintenanceWindow can be set.
                    properties:
                      startTime:
                        description: |-
                          StartTime represents the wall-clock time within the maintenance window to start the
                          maintenance operations, in "HH:MM" format, where HH : [00-23] and MM : [00-59] GMT.
                          This is a time-of-day value, not a full date-time, so it is not expressed as a
                          richer time type.
                        type: string
                    type: object
                  disruptionBudget:
                    description: DisruptionBudget represents the upgrade disruption
                      budget for the GKE cluster control plane.
                    properties:
                      minorVersionDisruptionInterval:
                        description: |-
                          MinorVersionDisruptionInterval represents the minimum duration between two minor version
                          upgrades of the control plane.
                        type: string
                      patchVersionDisruptionInterval:
                        description: |-
                          PatchVersionDisruptionInterval represents the minimum duration between two patch version
                          upgrades of the control plane.
                        type: string
                    type: object
                  maintenanceExclusions:
                    additionalProperties:
                      description: TimeWindow represents an arbitrary window of time.
                      properties:
                        endTime:
                          description: EndTime represents the time that the window
                            ends. This is ignored if using tracking as GKE computes
                            it.
                          format: date-time
                          type: string
                        endTimeBehavior:
                          description: EndTimeBehavior represents an event on which
                            to end a time window rather than a specific time
                          enum:
                          - until-end-of-support
                          type: string
                        maintenanceExclusionOption:
                          description: |-
                            MaintenanceExclusionOption represents the maintenance exclusion scope for which
                            upgrades are blocked by the exclusion.
                          enum:
                          - no-upgrades
                          - no-minor-upgrades
                          - no-minor-or-node-upgrades
                          type: string
                        startTime:
                          description: StartTime represents the time that the window
                            first starts.
                          format: date-time
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: endTime must be after startTime
                        rule: '!has(self.endTime) || self.startTime < self.endTime'
                      - message: endTime is required unless endTimeBehavior is set
                        rule: has(self.endTime) || has(self.endTimeBehavior)
                      - message: endTimeBehavior until end-of-support requires a no-minor-upgrades
                          or no-minor-or-node-upgrades exclusion option
                        rule: '!has(self.endTimeBehavior) || (has(self.maintenanceExclusionOption)
                          && self.maintenanceExclusionOption != ''no-upgrades'')'
                    description: |-
                      MaintenanceExclusions represents a map of maintenance exclusion names to a TimeWindow representing the exclusion period
                      (consists of a start time, end time, and exclusion scope). Non-emergency maintenance should not occur in these windows.
                      A maximum of 3 maintenance exclusions with "no-upgrades" is allowed. This limit is enforced by the
                      validating webhook rather than a CRD-level constraint, since it requires counting entries by their
                      (optional, defaulted) MaintenanceExclusionOption value.
                    maxProperties: 20
                    type: object
                  recurringMaintenanceWindow:
                    description: |-
                      RecurringMaintenanceWindow represents a recurring maintenance time window for use with the GKE cluster.
                      Only one of DailyMaintenanceWindow and RecurringMaintenanceWindow can be set.
                    properties:
                      recurrence:
                        description: |-
                          Recurrence represents a RRULE (https://tools.ietf.org/html/rfc5545#section-3.8.5.3) for how
                          the given window recurs. They go on for the span of time between the start and end time.
                          For more detail see (https://pkg.go.dev/cloud.google.com/go/container/apiv1/containerpb#RecurringTimeWindow)
                        type: string
                      window:
                        description: Window represents the time window of first recurrence.
                        properties:
                          endTime:
                            description: EndTime represents the time that the window
                              ends. This is ignored if using tracking as GKE computes
                              it.
                            format: date-time
                            type: string
                          endTimeBehavior:
                            description: EndTimeBehavior represents an event on which
                              to end a time window rather than a specific time
                            enum:
                            - until-end-of-support
                            type: string
                          maintenanceExclusionOption:
                            description: |-
                              MaintenanceExclusionOption represents the maintenance exclusion scope for which
                              upgrades are blocked by the exclusion.
                            enum:
                            - no-upgrades
                            - no-minor-upgrades
                            - no-minor-or-node-upgrades
                            type: string
                          startTime:
                            description: StartTime represents the time that the window
                              first starts.
                            format: date-time
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: endTime must be after startTime
                          rule: '!has(self.endTime) || self.startTime < self.endTime'
                        - message: endTime is required unless endTimeBehavior is set
                          rule: has(self.endTime) || has(self.endTimeBehavior)
                        - message: endTimeBehavior until end-of-support requires a
                            no-minor-upgrades or no-minor-or-node-upgrades exclusion
                            option
                          rule: '!has(self.endTimeBehavior) || (has(self.maintenanceExclusionOption)
                            && self.maintenanceExclusionOption != ''no-upgrades'')'
                    type: object
                    x-kubernetes-validations:
                    - message: recurringMaintenanceWindows cannot set endTimeBehavior
                      rule: '!has(self.window) || !has(self.window.endTimeBehavior)'
                type: object
                x-kubernetes-validations:
                - message: only one of dailyMaintenanceWindow and recurringMaintenanceWindow
                    may be set
                  rule: '!(has(self.dailyMaintenanceWindow) && has(self.recurringMaintenanceWindow))'
              master_authorized_networks_config:
                description: |-
                  MasterAuthorizedNetworksConfig represents configuration options for master authorized networks feature of the GKE cluster.
                  This feature is disabled if this field is not specified.
                properties:
                  cidr_blocks:
                    description: |-
                      cidr_blocks define up to 50 external networks that could access
                      Kubernetes master through HTTPS.
                    items:
                      description: MasterAuthorizedNetworksConfigCidrBlock contains
                        an optional name and one CIDR block.
                      properties:
                        cidr_block:
                          description: cidr_block must be specified in CIDR notation.
                          pattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?:\/([0-9]|[1-2][0-9]|3[0-2]))?$|^([a-fA-F0-9:]+:+)+[a-fA-F0-9]+\/[0-9]{1,3}$
                          type: string
                        display_name:
                          description: display_name is an field for users to identify
                            CIDR blocks.
                          type: string
                      type: object
                    type: array
                  gcp_public_cidrs_access_enabled:
                    description: Whether master is accessible via Google Compute Engine
                      Public IP addresses.
                    type: boolean
                type: object
              monitoringConfig:
                description: MonitoringConfig represents configuration of the monitoring
                  feature of the GKE cluster.
                properties:
                  managedPrometheusConfig:
                    description: ManagedPrometheusConfig configures Google Cloud Managed
                      Service for Prometheus for the cluster.
                    properties:
                      enabled:
                        description: |-
                          Enabled controls whether Google Cloud Managed Service for Prometheus is enabled for the cluster.
                          GKE enables this by default; set to false to disable it. This field cannot be set on Autopilot clusters.
                        type: boolean
                    type: object
                type: object
              monitoringService:
                description: |-
                  MonitoringService represents configuration of monitoring service feature of the GKE cluster.
                  Possible values: none, monitoring.googleapis.com/kubernetes (default).
                  Value is ignored when enableAutopilot = true.
                type: string
              project:
                description: Project is the name of the project to deploy the cluster
                  to.
                type: string
              releaseChannel:
                description: ReleaseChannel represents the release channel of the
                  GKE cluster.
                enum:
                - rapid
                - regular
                - stable
                - extended
                type: string
              version:
                description: |-
                  Version represents the control plane version of the GKE cluster.
                  If not specified, the default version currently supported by GKE will be
                  used.
                type: string
            required:
            - location
            - project
            type: object
          status:
            description: GCPManagedControlPlaneStatus defines the observed state of
              GCPManagedControlPlane.
            properties:
              conditions:
                description: Conditions specifies the conditions for the managed control
                  plane
                items:
                  description: Condition defines an observation of a Cluster API resource
                    operational state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This field may be empty.
                      maxLength: 10240
                      minLength: 1
                      type: string
                    reason:
                      description: |-
                        reason is the reason for the condition's last transition in CamelCase.
                        The specific API may choose whether or not this field is considered a guaranteed API.
                        This field may be empty.
                      maxLength: 256
                      minLength: 1
                      type: string
                    severity:
                      description: |-
                        severity provides an explicit classification of Reason code, so the users or machines can immediately
                        understand the current situation and act accordingly.
                        The Severity field MUST be set only when Status=False.
                      maxLength: 32
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                        can be useful (see .node.status.conditions), the ability to deconflict is important.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              currentVersion:
                description: |-
                  CurrentVersion shows the current version of the GKE control plane.

                  Deprecated: This field will soon be removed and you are expected to use Version instead.
                type: string
              initialized:
                description: |-
                  Initialized is true when the control plane is available for initial contact.
                  This may occur before the control plane is fully ready.
                type: boolean
              ready:
                default: false
                description: |-
                  Ready denotes that the GCPManagedControlPlane API Server is ready to
                  receive requests.
                type: boolean
              v1beta2:
                description: v1beta2 groups all the fields that will be added or modified
                  in GCPManagedControlPlane's status with the v1beta2 contract.
                properties:
                  conditions:
                    description: conditions represents the observations of a GCPManagedControlPlane's
                      current state.
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                type: object
              version:
                description: Version represents the version of the GKE control plane.
                type: string
            required:
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
